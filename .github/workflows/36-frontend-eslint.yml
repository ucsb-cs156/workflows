# Example invocation with a custom timeout:
# jobs:
#   frontend-eslint:
#     uses: ucsb-cs156/workflows/.github/workflows/36-frontend-eslint.yml@main
#     with:
#       TIMEOUT: 10

name: "36-frontend-eslint: JavaScript style checking"

on:
  workflow_call:
    inputs:
      enable_typescript:
        description: "Run `npx tsc -b` in frontend/ right after `npm ci`, so a type error fails fast before the slower work below. Opt in from repos whose frontend is TypeScript; off by default."
        required: false
        type: boolean
        default: false
      TIMEOUT:
        required: false
        type: number
        default: 10

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.TIMEOUT }}

    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/Los_Angeles"
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/package.json'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Type check (fail fast; opt-in via enable_typescript)
        if: ${{ inputs.enable_typescript }}
        run: npx tsc -b
        working-directory: ./frontend
      - run: npx eslint --max-warnings 0 .
        working-directory: ./frontend