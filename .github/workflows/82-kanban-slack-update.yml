# SUPERSEDED (October 2026): the Kanban board Slack summary now runs once,
# centrally, from ucsb-cs156-<qxx>/membership-scripts (workflow 82 there,
# kanban_slack_update.py), which iterates over all team repos of every
# assignment whose date window is open.  The per-repo wrappers that called
# this reusable workflow are being removed from the starters and team repos;
# see https://ucsb-cs156.github.io/topics/github_actions/workflow_82.html and
# https://github.com/ucsb-cs156-f26/membership-scripts/issues/10.
# This file is kept for one quarter for repos that still reference it and
# will then be deleted.
#
# Reusable workflow: post a Kanban board status table to the team's Slack channel.
#
# Instructions to set up the workflow can be found here:
# <https://ucsb-cs156.github.io/topics/github_actions/workflow_82.html>
#
# Example invocation (in a team repo, e.g. team01-f26-01):
#
# name: "82-kanban-slack-update.yml"
# on:
#   schedule:
#     - cron: "0 0,4 * * 3-5"  # 0,4 UTC are 4pm, 8pm Pacific Standard Time on T W R
#     - cron: "0 0 * * 1,2,6,0" # runs at 4pm on M F SS
#   workflow_dispatch:
# jobs:
#   kanban-slack-update:
#     uses: ucsb-cs156/workflows/.github/workflows/82-kanban-slack-update.yml@main
#     with:
#       START_DATE: ${{ vars.TEAM01_START_DATE }}
#       END_DATE: ${{ vars.TEAM01_END_DATE }}
#     secrets:
#       PAT: ${{ secrets.PAT }}
#       SLACK_BOT_USER_OAUTH_ACCESS_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
#
# The team name is taken from the last 6 characters of the repository name
# (e.g. "f26-01" for team01-f26-01).  The report is posted to the Slack channel
# named SLACK_CHANNEL_PREFIX + team name, e.g. "team-f26-01".
#
# The columns reported on are discovered from the board: the options of the
# project's STATUS_FIELD (default "Status") single-select field, in board order.
# Pass COLUMNS to override that with an explicit comma separated list.

name: "82-kanban-slack-update: Post Kanban status to Slack"

on:
  workflow_call:
    inputs:
      START_DATE:
        description: "First date (YYYY-MM-DD) on which the report should be posted"
        required: true
        type: string
      END_DATE:
        description: "Last date (YYYY-MM-DD) on which the report should be posted"
        required: true
        type: string
      COLUMNS:
        description: "Comma separated list of Kanban board columns to report on. Leave empty to report on all columns found on the board."
        required: false
        type: string
        default: ""
      STATUS_FIELD:
        description: "Name of the single-select project field whose options are the board columns"
        required: false
        type: string
        default: "Status"
      SLACK_CHANNEL_PREFIX:
        description: "Prefix added to the team name to get the Slack channel name, e.g. team- for team-f26-01"
        required: false
        type: string
        default: "team-"
    secrets:
      PAT:
        description: "Classic personal access token with read access to the org's GitHub Projects"
        required: true
      SLACK_BOT_USER_OAUTH_ACCESS_TOKEN:
        description: "Slack bot token used to look up channels and post the report"
        required: true

env:
  PAT: ${{ secrets.PAT }}
  GH_TOKEN: ${{ secrets.PAT }}
  ORG_NAME: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  # The columns in the Kanban board that we are interested in
  # (empty = discover from the board's STATUS_FIELD)
  COLUMNS: ${{ inputs.COLUMNS }}
  STATUS_FIELD: ${{ inputs.STATUS_FIELD }}
  START_DATE: ${{ inputs.START_DATE }}
  END_DATE: ${{ inputs.END_DATE }}

jobs:

  # This job checks if the current date is between START_DATE and END_DATE,
  # and that this is not a STARTER repo or a repo in the ucsb-cs156 organization.
  check_date:
    name: Check Date
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check_date.outputs.continue }}
    steps:
      - name: Check if current date is between START_DATE and END_DATE
        id: check_date
        run: |
          current_date=$(date +%Y-%m-%d)
          end_date="${{ env.END_DATE }}"
          start_date="${{ env.START_DATE }}"

          if [[ -z "$start_date" || -z "$end_date" ]]; then
            echo "START_DATE ('$start_date') or END_DATE ('$end_date') is empty. Stopping workflow."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          elif [[ "$current_date" > "$end_date" ]]; then
            echo "Current date is after $end_date. Stopping workflow."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          elif [[ "$current_date" < "$start_date" ]]; then
            echo "Current date is before $start_date. Stopping workflow."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "Current date is between $start_date and $end_date. Continuing workflow."
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi

          OWNER=${{ github.repository_owner }}
          OWNER_PLUS_REPOSITORY=${{ github.repository }}
          REPOSITORY=${OWNER_PLUS_REPOSITORY/$OWNER\//}
          if [[ "$OWNER" == "ucsb-cs156" ]]; then
            echo "This workflow should not run on repos in the ucsb-cs156 organization"
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$REPOSITORY" == STARTER* ]]; then
            echo "This workflow should not run on STARTER repos"
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$GITHUB_OUTPUT" ]]; then
            echo "Contents of $GITHUB_OUTPUT:"
            cat "$GITHUB_OUTPUT"
          fi

  # This job extracts the team name from the repository name
  # It does this by extracting the last 6 characters of the repository name
  # (e.g. "f26-01" for team01-f26-01).  The Slack channel name is
  # SLACK_CHANNEL_PREFIX + team name (e.g. "team-f26-01").
  get_team_name:
    name: Get Team Name and Repository Name
    runs-on: ubuntu-latest
    needs: check_date
    if: needs.check_date.outputs.continue == 'true'
    outputs:
      team: ${{ steps.find_team.outputs.team }}
      repository: ${{ steps.find_team.outputs.repository }}
      slack_channel_name: ${{ steps.find_team.outputs.slack_channel_name }}
    steps:
      - name: Extract Team Name from Repo
        id: find_team
        env:
          SLACK_CHANNEL_PREFIX: ${{ inputs.SLACK_CHANNEL_PREFIX }}
        run: |
          REPO=${{ github.repository }}
          TEAM_NAME="${REPO: -6}"

          OWNER_PLUS_REPOSITORY=${{ github.repository }}
          OWNER=${{ github.repository_owner }}
          REPOSITORY=${OWNER_PLUS_REPOSITORY/$OWNER\//}

          {
            echo "repository=${REPOSITORY}"
            echo "team=${TEAM_NAME}"
            echo "slack_channel_name=${SLACK_CHANNEL_PREFIX}${TEAM_NAME}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # This job finds the project ID for the team based on the repository name,
  # queries the project items, and counts issues by column and assignee.
  get_project_id:
    name: Find Project ID that matches the repo name
    runs-on: ubuntu-latest
    needs: [check_date, get_team_name]
    if: needs.check_date.outputs.continue == 'true'
    env:
      REPOSITORY: ${{ needs.get_team_name.outputs.repository }}
    steps:
      - name: Debugging Output
        run: |
          echo "needs.get_team_name.outputs.team=${{ needs.get_team_name.outputs.team }}"
          echo "needs.get_team_name.outputs.repository=${{ needs.get_team_name.outputs.repository }}"
          echo "github.repository_owner=${{ github.repository_owner }}"
      - name: Fetch Project Id using gh
        id: find_project_gh
        run: |
          # -e: exit immediately if any command fails (non-zero), instead of continuing
          # -u: treat unset variables as errors to catch typos/missing env vars
          # -o pipefail: pipelines fail if any command in the pipe fails (not just the last)
          set -euo pipefail

          ORG_LOGIN="${{ github.repository_owner }}"
          PROJECT_TITLE="${{ needs.get_team_name.outputs.repository }}"

          # Query first 100 projects; paginate if you might have more than 100.
          PROJECT_ID="$(
            gh api graphql -f query='
              query($org: String!, $first: Int!) {
                organization(login: $org) {
                  projectsV2(first: $first) {
                    nodes { id title }
                  }
                }
              }' \
              -f org="$ORG_LOGIN" \
              -F first=100 \
              --jq ".data.organization.projectsV2.nodes[] | select(.title == \"$PROJECT_TITLE\") | .id"
          )"

          if [[ -z "${PROJECT_ID}" ]]; then
            echo "ERROR: No project titled '$PROJECT_TITLE' found in org '$ORG_LOGIN'." >&2
            exit 1
          fi

          echo "PROJECT_ID=$PROJECT_ID"
          echo "$PROJECT_ID" >> project_id.txt
          ls project_id.txt
          cat project_id.txt
          pwd

      - name: Fetch Kanban Columns
        id: fetch_columns
        env:
          COLUMNS_INPUT: ${{ env.COLUMNS }}
          STATUS_FIELD: ${{ env.STATUS_FIELD }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(cat project_id.txt)

          if [[ -n "${COLUMNS_INPUT// /}" ]]; then
            echo "Using COLUMNS input: $COLUMNS_INPUT"
            jq -nc --arg c "$COLUMNS_INPUT" \
              '$c | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' \
              > columns.json
          else
            echo "Discovering columns from the '$STATUS_FIELD' field of the project"
            gh api graphql -f query='
              query($project: ID!, $field: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    field(name: $field) {
                      ... on ProjectV2SingleSelectField { name options { name } }
                    }
                  }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f field="$STATUS_FIELD" \
              --jq '[.data.node.field.options[]?.name]' > columns.json
          fi

          echo "Columns: $(cat columns.json)"
          if [[ "$(jq length columns.json)" -eq 0 ]]; then
            echo "ERROR: No columns found. Check that the project has a single-select field named '$STATUS_FIELD'." >&2
            exit 1
          fi

      - name: Output GraphQL Query Result
        id: output_query
        run: |
          ls
          PROJECT_ID=$(cat project_id.txt)
          GQL_QUERY="{ node(id: \"$PROJECT_ID\") { ... on ProjectV2 { items(first: 100) { nodes { id fieldValues(first: 100) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { field { ... on ProjectV2FieldCommon { name } } name } ... on ProjectV2ItemFieldTextValue { field { ... on ProjectV2Field { name } } text } } } content { ... on Issue { title assignees(first: 10) { nodes { login } } } ... on PullRequest { title assignees(first: 10) { nodes { login } } } } } } } } }"
          QUERY=$(jq -nc --arg q "$GQL_QUERY" '{"query": $q}')
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)
          echo "$RESPONSE"
          echo "$RESPONSE" >> project_data.json
          ls project_data.json
          cat project_data.json

      - name: Count Issues by Column and Assignee
        id: count_issues
        shell: python
        env:
          STATUS_FIELD: ${{ env.STATUS_FIELD }}
        run: |
          import json
          import os
          with open('project_data.json', 'r') as f:
              data = json.load(f)
          with open('columns.json', 'r') as f:
              columns = json.load(f)
          status_field = os.environ.get('STATUS_FIELD', 'Status')

          issue_counts = {}

          for item in data['data']['node']['items']['nodes']:
              # The item's value of the Status field, if it is one of the columns
              column_field = next(
                  (n for n in item['fieldValues']['nodes']
                   if n.get('name') in columns
                   and (n.get('field') or {}).get('name', status_field) == status_field),
                  None
              )
              if column_field is not None:
                  column = column_field.get('name')
                  if column is not None:
                      assignees = [n['login'] for n in item['content'].get('assignees', {}).get('nodes', [])]
                      if not assignees:
                          assignees = ['UNASSIGNED']
                      for assignee in assignees:
                          if column not in issue_counts:
                              issue_counts[column] = {}
                          if assignee not in issue_counts[column]:
                              issue_counts[column][assignee] = 0
                          issue_counts[column][assignee] += 1

          issue_counts_json = json.dumps(issue_counts, indent=2)
          with open('issue_counts.json', 'w') as f:
              f.write(issue_counts_json)
          print("Issue count process completed")
      - name: Display issue_counts.json for debugging
        run: |
          echo "Contents of issue_counts.json:"
          cat issue_counts.json
      - name: Upload issue counts
        uses: actions/upload-artifact@v6
        with:
          name: issue_counts
          path: |
            issue_counts.json
            columns.json
          overwrite: true

  # This job generates an ASCII table from the issue counts
  # It does this by parsing the issue counts JSON and formatting it into an ASCII table
  # Also uploads the ASCII table as an artifact for the next job
  generate_ascii_table:
    name: Generate ASCII Table
    runs-on: ubuntu-latest
    needs: [check_date, get_project_id]
    if: needs.check_date.outputs.continue == 'true'
    steps:
      - name: Download issue counts
        uses: actions/download-artifact@v6
        with:
          name: issue_counts

      - name: Generate ASCII Table
        id: generate_table
        shell: python
        run: |
          import json
          import sys

          with open('columns.json', 'r') as f:
              columns = json.load(f)
          with open('issue_counts.json', 'r') as f:
              content = f.read()

          if not content.strip():
              print("ISSUE_COUNTS is empty or not set")
              sys.exit(1)

          issue_counts = json.loads(content)

          # Collect all assignees and track unassigned issues
          assignees = {}
          unassigned_counts = {}

          for column in issue_counts:
              unassigned_counts[column] = 0
              for assignee, count in issue_counts[column].items():
                  if assignee == 'UNASSIGNED':
                      unassigned_counts[column] += count
                  else:
                      if assignee not in assignees:
                          assignees[assignee] = {}
                      assignees[assignee][column] = count

          # Column headers: abbreviate to 4 characters, but if two columns
          # would get the same abbreviation, use the full names instead.
          abbrevs = [column[:4] for column in columns]
          if len(set(abbrevs)) != len(abbrevs):
              abbrevs = list(columns)
          widths = [max(4, len(a)) for a in abbrevs]

          # Generate the table header with left-aligned text
          header = "| login            |"
          for abbrev, width in zip(abbrevs, widths):
              header += f" {abbrev:<{width}} |"

          # Define the separator with exact dash counts for each column
          separator = "|------------------|"
          for width in widths:
              separator += "-" * (width + 2) + "|"

          # Construct the full table
          table = f"{header}\n{separator}\n"

          # Generate the table rows
          for assignee in assignees:
              row = f"| {assignee[:17]:<17}|"
              for column, width in zip(columns, widths):
                  count = str(assignees[assignee].get(column, 0))
                  row += f" {count:>{width}} |"
              table += row + "\n"

          # Add the unassigned row
          unassigned_row = f"| {'UNASSIGNED':<17}|"
          for column, width in zip(columns, widths):
              count = str(unassigned_counts.get(column, 0))
              unassigned_row += f" {count:>{width}} |"
          table += unassigned_row + "\n"

          # Add a double rule and a TOTAL row (assigned + unassigned, per column)
          double_rule = "|==================|"
          for width in widths:
              double_rule += "=" * (width + 2) + "|"
          table += double_rule + "\n"

          total_row = f"| {'TOTAL':<17}|"
          for column, width in zip(columns, widths):
              total = unassigned_counts.get(column, 0) + sum(
                  counts.get(column, 0) for counts in assignees.values()
              )
              total_row += f" {total:>{width}} |"
          table += total_row + "\n"

          print(f"ASCII Table:\n{table}")
          with open('ascii_table.txt', 'w') as f:
              f.write(table)

      - name: Upload ASCII Table
        uses: actions/upload-artifact@v6
        with:
          name: ascii_table
          path: ascii_table.txt
          overwrite: true

  # This job looks up the id of the Slack channel named after the team
  # (e.g. "team-f26-01") and fails with a clear message if it does not exist.
  find_slack_channel:
    name: Find Slack Channel for Team
    runs-on: ubuntu-latest
    needs: [check_date, get_team_name]
    if: needs.check_date.outputs.continue == 'true'
    outputs:
      SLACK_CHANNEL_ID: ${{ steps.find_slack_channel.outputs.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Find Slack Channel Id
        id: find_slack_channel
        env:
          SLACK_CHANNEL_NAME: ${{ needs.get_team_name.outputs.slack_channel_name }}
          SLACK_BOT_USER_OAUTH_ACCESS_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install slack_sdk

          python - <<'PY'
          import os
          import sys
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError

          def list_channels(client, types):
            """
            Returns a dict mapping channel name -> channel id for all channels
            of the given types, following Slack's pagination cursor.
            """
            channels = {}
            cursor = None
            while True:
              result = client.conversations_list(
                types=types, limit=1000, exclude_archived=True, cursor=cursor
              )
              for channel in result["channels"]:
                channels[channel["name"]] = channel["id"]
              cursor = result.get("response_metadata", {}).get("next_cursor")
              if not cursor:
                break
            return channels

          channel_name = os.environ["SLACK_CHANNEL_NAME"]
          token = os.environ.get("SLACK_BOT_USER_OAUTH_ACCESS_TOKEN")
          if not token:
            raise EnvironmentError("SLACK_BOT_USER_OAUTH_ACCESS_TOKEN is not set.")

          client = WebClient(token=token)
          try:
            channels = list_channels(client, "public_channel,private_channel")
          except SlackApiError as e:
            # The bot may lack the groups:read scope needed for private channels;
            # fall back to public channels only.
            print(f"Listing public+private channels failed ({e.response['error']}); retrying with public channels only")
            channels = list_channels(client, "public_channel")

          print(f"Found {len(channels)} channels")
          channel_id = channels.get(channel_name)
          if not channel_id:
            similar = sorted(n for n in channels if channel_name[-6:] in n)
            print(f"ERROR: No Slack channel named '{channel_name}' found.", file=sys.stderr)
            print(f"Channels containing '{channel_name[-6:]}': {similar}", file=sys.stderr)
            print("Check that the channel exists and that the Slack app has been added to it.", file=sys.stderr)
            sys.exit(1)

          print(f"Slack channel '{channel_name}' has id {channel_id}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"SLACK_CHANNEL_ID={channel_id}\n")
          PY

  send-to-slack:
    name: Send Report to Slack
    runs-on: ubuntu-latest
    needs: [check_date, generate_ascii_table, get_team_name, find_slack_channel]
    if: needs.check_date.outputs.continue == 'true'
    env:
      SLACK_CHANNEL_NAME: ${{ needs.get_team_name.outputs.slack_channel_name }}
      SLACK_CHANNEL_ID: ${{ needs.find_slack_channel.outputs.SLACK_CHANNEL_ID }}
    steps:
      - name: Download ASCII Table
        uses: actions/download-artifact@v6
        with:
          name: ascii_table

      - name: Read ASCII Table
        id: read_ascii_table
        run: |
          table=$(cat ascii_table.txt)
          echo "ASCII Table Content:"
          printf "%s\n" "$table"  # Use printf for better handling of multiline text
          echo "$table" > ascii_table_content.txt
          echo "ascii_table_content<<EOF" >> $GITHUB_ENV
          cat ascii_table_content.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      # This step is used to debug the environment variables and Slack text.
      # The ASCII table content is written to a file and then read back into
      # $GITHUB_ENV so that the multiline text can be used in the Slack message.
      - name: Debug Environment Variables
        run: |
          echo "ORG_NAME: ${{ env.ORG_NAME }}"
          echo "Team: ${{ needs.get_team_name.outputs.team }}"
          echo "Slack Channel: ${{ env.SLACK_CHANNEL_NAME }} (${{ env.SLACK_CHANNEL_ID }})"
          echo "ASCII Table:"
          cat ascii_table_content.txt
      # This step sends the report to the Slack channel associated with the team
      - name: Send Report to Slack
        uses: archive/github-actions-slack@v2.9.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          slack-channel: ${{ env.SLACK_CHANNEL_ID }}
          slack-text: |
            📋 *Kanban Board Status* ✔️ (${{ github.event.repository.name }})
            ```
            ${{ env.ascii_table_content }}
            ```
