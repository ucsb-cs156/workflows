name: "15-backend-format: Format Java Files"

on:
  workflow_call:
    inputs:
      JAVA_DISTRIBUTION:
        required: false
        type: string
        default: 'temurin'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (version from .java-version file)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }} 
          java-version-file: ./.java-version
          cache: 'maven'
          cache-dependency-path: 'pom.xml' 

      - name: Check formatting with Maven
        run: mvn -ntp git-code-format:validate-code-format

      - name: "IF STEP ABOVE FAILS ^^^ you need: mvn -ntp git-code-format:format-code"
        if: failure() # Only run if the previous step failed
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Note :warning:

          Some of your code is improperly formatted.

          To fix it, try running this:

          `mvn -ntp git-code-format:format-code`

          EOF